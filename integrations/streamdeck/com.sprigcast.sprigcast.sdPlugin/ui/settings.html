<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>SprigCast</title>
		<link rel="stylesheet" href="settings.css" />
	</head>
	<body>
		<form id="fields" autocomplete="off"></form>
		<details id="connection">
			<summary>Connection</summary>
			<label class="row"><span>Port</span><input id="port" type="number" min="1" max="65535" placeholder="Auto" /></label>
			<label class="row"><span>Password</span><input id="password" type="password" /></label>
			<p class="note" id="status"></p>
			<p class="note">From SprigCast: Settings → Connections. Leave the port blank to look on 4455 and 4456. Every SprigCast key shares these.</p>
		</details>
		<script src="settings.js"></script>
	</body>
</html>
