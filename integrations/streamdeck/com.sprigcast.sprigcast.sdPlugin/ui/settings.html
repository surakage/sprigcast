<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>SprigCast</title>
		<link rel="stylesheet" href="settings.css" />
	</head>
	<body>
		<form id="fields" autocomplete="off"></form>
		<label class="row"><span>Key style</span><select id="style">
			<option value="canopy">Canopy</option>
			<option value="colour">Colour</option>
			<option value="graphite">Graphite</option>
		</select></label>
		<details id="connection">
			<summary>Connection</summary>
			<label class="row"><span>Port</span><input id="port" type="number" min="1" max="65535" placeholder="Automatic" /></label>
			<label class="row"><span>Password</span><input id="password" type="password" placeholder="Automatic" /></label>
			<p class="note" id="status"></p>
			<p class="note">Leave both empty: the plugin finds SprigCast on this PC by itself and connects when it opens.</p>
		</details>
		<script src="settings.js"></script>
	</body>
</html>
