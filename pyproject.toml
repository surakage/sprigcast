[project]
name = "sprigcast"
version = "0.1.0"
description = "Lightweight open-source streaming app with horizontal and vertical canvases"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.7",
    "moderngl>=5.10",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pillow>=10.0",
    "av>=12.0",
    "windows-capture>=2.0; sys_platform == 'win32'",  # display and window capture (M3)
    "opencv-python>=4.9",  # camera capture (M5)
    "cv2-enumerate-cameras>=1.4; sys_platform == 'win32'",  # camera names and stable device paths
]

[project.optional-dependencies]
# Needed from milestone M6 onward (audio, hotkeys).
devices = [
    "sounddevice>=0.4",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "soxr>=0.3",
    "keyring>=25",
    "pynput>=1.7",
]

[project.scripts]
sprigcast = "sprigcast.app.main:run"
sprigcast-check = "sprigcast.tools.check:main"
sprigcast-teststream = "sprigcast.tools.teststream:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprigcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
