[project]
name = "sprigcast"
version = "0.2.0"
description = "Lightweight open-source streaming app with horizontal and vertical canvases"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.12",  # Qt WebEngine 6.12 = Chromium 140 for browser sources and web docks
    "moderngl>=5.10",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pillow>=10.0",
    "av>=12.0",
    "windows-capture>=2.0; sys_platform == 'win32'",  # display and window capture (M3)
    "opencv-python>=4.9",  # camera capture (M5)
    "cv2-enumerate-cameras>=1.4; sys_platform == 'win32'",  # camera names and stable device paths
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",  # mic and desktop audio over WASAPI (M6)
    "soxr>=0.3",  # resampling to 48 kHz
    "keyring>=25",  # stream keys in Windows Credential Manager (M8)
    "pynput>=1.7; sys_platform == 'win32'",  # global hotkeys (M10)
    "psutil>=5.9",  # CPU and memory in the stats panel (M10)
    "TikTokLive>=7.0.1",  # TikTok chat when TikFinity isn't running (unofficial; loaded only when used)
    "pedalboard>=0.9.26",  # VST3 plug-ins as sound filters (GPL-3; loaded only when a sound uses one)
    "faster-whisper>=1.1",  # Live captions store plugin, on this PC (loaded only while captions are on air)
]

[project.scripts]
sprigcast = "sprigcast.app.main:run"
sprigcast-check = "sprigcast.tools.check:main"
sprigcast-teststream = "sprigcast.tools.teststream:main"
sprigcast-memcheck = "sprigcast.tools.memcheck:main"

[tool.uv]
# faster-whisper asks for onnxruntime only for its own voice detector, which Live captions doesn't use
# (it finds speech itself). On Windows, onnxruntime-directml brings the same module, so plain
# onnxruntime is left out there; elsewhere it stays.
override-dependencies = ["onnxruntime>=1.20; sys_platform != 'win32'"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprigcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." lets tests import shared helpers from other test files
