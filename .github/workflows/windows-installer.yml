name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # a v* tag publishes a GitHub Release, which the in-app updater reads

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Inno Setup 6.7 (dark wizard) on PATH
        shell: pwsh
        run: |
          # The runner's own Inno Setup may be older than 6.7, which the dark wizard needs: install a pinned copy.
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile $exe
          Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir "ISCC.exe"))) { throw "Inno Setup didn't install to $dir" }
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Check the installed copy starts
        shell: pwsh
        run: |
          $py = "packaging\build\python\python.exe"
          & $py -c "import sprigcast, av, moderngl, PySide6.QtWidgets, numpy; print('imports OK', sprigcast.__file__)"
          & $py -m sprigcast.tools.check
          & $py -c "from sprigcast import sprigcore; assert sprigcore.available(), sprigcore.dll_path(); print('native engine OK', sprigcore.adapters())"
          if ($LASTEXITCODE -ne 0) { throw "The installed copy can't load the native engine" }
          # After pruning (prune.py): every Qt module SprigCast imports loads, and a web page still opens
          # in Qt WebEngine (its helper, resources and US English text are all there).
          & $py -c "from PySide6 import QtCore, QtGui, QtWidgets, QtNetwork, QtSvg, QtWebChannel, QtWebSockets, QtWebEngineCore, QtWebEngineWidgets; print('Qt modules OK')"
          if ($LASTEXITCODE -ne 0) { throw "A Qt module SprigCast uses is missing after pruning" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $py -c "import sys; from PySide6 import QtCore, QtWidgets, QtWebEngineCore; app = QtWidgets.QApplication(sys.argv); page = QtWebEngineCore.QWebEnginePage(); ok = []; page.loadFinished.connect(lambda r: (ok.append(r), app.quit())); QtCore.QTimer.singleShot(60000, app.quit); page.setHtml('<p>SprigCast</p>'); app.exec(); print('web page loads:', ok); sys.exit(0 if ok == [True] else 1)"
          if ($LASTEXITCODE -ne 0) { throw "Qt WebEngine can't open a page after pruning" }
          Remove-Item Env:QT_QPA_PLATFORM
          # Browser sources run in a helper started from SprigCast.exe (#451): it must start, open a page and
          # stay up (no restarts). Chromium doesn't paint offscreen on Windows, so frames aren't checked here.
          $exe = (Resolve-Path "packaging\build\python\SprigCast.exe").Path
          $page = Join-Path $env:RUNNER_TEMP "page.html"
          Set-Content $page "<body style='background:#4fd88f'>SprigCast</body>"
          & $py -c "import logging, sys, time; logging.basicConfig(level=logging.INFO, stream=sys.stdout); sys.executable = r'$exe'; from sprigcast.app import browser_helper as b; h = b.RemoteHost(); h.open('t', {'file': r'$page', 'width': 64, 'height': 36, 'fps': 10}); time.sleep(15); alive = h.proc is not None and h.proc.poll() is None; print('browser helper OK' if alive and h.starts == 1 else f'browser helper FAILED (starts {h.starts})'); h.shutdown(); sys.exit(0 if alive and h.starts == 1 else 1)"
          if ($LASTEXITCODE -ne 0) { throw "The browser helper didn't stay up when started from SprigCast.exe" }
          $size = (Get-ChildItem packaging\build\python -Recurse -File | Measure-Object Length -Sum).Sum
          "Installed size: $([math]::Round($size / 1MB)) MB"
          # SprigCast.exe runs the same Python (a single-dash first argument passes straight to Python).
          $probe = Join-Path $env:RUNNER_TEMP "launcher.txt"
          $p = Start-Process "packaging\build\python\SprigCast.exe" -ArgumentList "-c", "`"import sys, sprigcast; open(r'$probe', 'w').write(f'{sys.executable} {sys.getwindowsversion().build}')`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $probe)) { throw "SprigCast.exe didn't run Python (exit $($p.ExitCode))" }
          "SprigCast.exe runs as: $(Get-Content $probe)"
          # Its manifest must say Windows 10/11, or Windows reports build 9200 and Windows 10 features switch off.
          $build = [int]((Get-Content $probe) -split ' ')[-1]
          if ($build -lt 10000) { throw "SprigCast.exe sees Windows build ${build}: its manifest is missing" }
          # The bundled font (#428) is in the installed copy.
          & $py -c "import sprigcast, pathlib; f = pathlib.Path(sprigcast.__file__).parent / 'data' / 'fonts' / 'Nunito.ttf'; assert f.is_file(), f; print('font OK')"
          if ($LASTEXITCODE -ne 0) { throw "Nunito.ttf is missing from the installed copy" }
      - name: Fingerprints and a Microsoft Defender scan
        shell: pwsh
        run: |
          Get-FileHash packaging\out\*.exe, packaging\build\python\Lib\site-packages\sprigcast\camera\*.dll, packaging\build\python\Lib\site-packages\sprigcast\engine\*.dll -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } | Tee-Object packaging\out\SHA256.txt
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Warning "Microsoft Defender isn't on this runner: no scan"; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          $failed = $false
          foreach ($target in (Resolve-Path packaging\out).Path, (Resolve-Path packaging\build\python).Path) {
            & $mp -Scan -ScanType 3 -File $target -DisableRemediation | Out-Host
            if ($LASTEXITCODE -eq 2) { $failed = $true; Write-Error "Defender flagged something in $target" -ErrorAction Continue }
          }
          if ($failed) { Get-MpThreatDetection | Format-List | Out-Host; exit 1 }
          "Defender found nothing" | Tee-Object -Append packaging\out\SHA256.txt
          exit 0
      - name: Screenshots of the wizard pages
        shell: pwsh
        continue-on-error: true
        run: |
          # Open Setup (not silent) and snap each page: Welcome, Install location, Extras and Finish.
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shots = New-Item -ItemType Directory -Force packaging\out\screens
          $setup = Get-ChildItem packaging\out\*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/LANG=en" -PassThru
          $shell = New-Object -ComObject WScript.Shell
          function Snap($name) {
            Start-Sleep -Seconds 3
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $shots "$name.png"))
          }
          Start-Sleep -Seconds 5
          $null = $shell.AppActivate("SprigCast Setup")
          Snap "1-welcome"
          $shell.SendKeys("{ENTER}"); Snap "2-location"
          $shell.SendKeys("{ENTER}"); Snap "3-extras"
          # Install (this runner is thrown away afterwards) and snap the Finish page.
          $null = $shell.AppActivate("SprigCast Setup"); $shell.SendKeys("{ENTER}")
          Start-Sleep -Seconds 90
          $null = $shell.AppActivate("SprigCast Setup"); Snap "4-finish"
          Get-Process | Where-Object { $_.ProcessName -like "SprigCast-Setup*" -or $_.ProcessName -like "*.tmp" } | Stop-Process -Force -ErrorAction SilentlyContinue
          # Also print them into the log (base64, in short lines), for reviewers that can read logs but not artifacts.
          foreach ($f in Get-ChildItem $shots -Filter *.png) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            "SHOT-BEGIN $($f.Name)"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { "SHOT " + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i)) }
            "SHOT-END $($f.Name)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SprigCast-Setup
          path: |
            packaging/out/*.exe
            packaging/out/SHA256.txt
            packaging/out/screens/*.png
          retention-days: 14
      # A v* tag also publishes a GitHub Release with the installer, SHA256.txt and that version's CHANGELOG
      # section. SprigCast's "Check for updates" reads the newest one; it checks the installer against
      # SHA256.txt before running it. Runs only after the Defender scan passed.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $setup = "packaging\out\SprigCast-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Tag $tag doesn't match the version that was built (see pyproject.toml)" }
          & packaging\build\python\python.exe packaging\release_notes.py $version notes.md
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md needs a section for $version" }
          gh release create $tag $setup packaging\out\SHA256.txt --title "SprigCast $version" --notes-file notes.md --verify-tag
