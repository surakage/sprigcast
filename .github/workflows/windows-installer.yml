name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tester_tag:
        description: "Publish a tester pre-release under this new tag: test-<version>-<number>, for example test-0.5-1 for Beta 0.5 test build 1. Leave empty for a plain build."
        required: false
        default: ""
  push:
    tags: ["v*", "test-*"]

permissions:
  contents: write  # a v* tag publishes a GitHub Release, which the in-app updater reads; a test-* tag a pre-release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags and history: a tester build's Discord post lists what changed since the last one
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4  # the Android SDK's d8 (the phone sound helper) needs Java 17
        with:
          distribution: temurin
          java-version: "17"
      - name: Inno Setup 6.7 (dark wizard) on PATH
        shell: pwsh
        run: |
          # The runner's own Inno Setup may be older than 6.7, which the dark wizard needs: install a pinned copy.
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe" -OutFile $exe
          Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir "ISCC.exe"))) { throw "Inno Setup didn't install to $dir" }
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build
        shell: pwsh
        env:
          # test-0.5-3 (typed in, or pushed) stamps "test build 3" into the app (build_windows.ps1).
          TESTER_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tester_tag || (startsWith(github.ref, 'refs/tags/test-') && github.ref_name || '') }}
        run: ./packaging/build_windows.ps1
      - name: Check the installed copy starts
        shell: pwsh
        run: |
          $py = "packaging\build\python\python.exe"
          & $py -c "import sprigcast, av, moderngl, PySide6.QtWidgets, numpy; print('imports OK', sprigcast.__file__)"
          & $py -m sprigcast.tools.check
          & $py -c "from sprigcast import sprigcore; assert sprigcore.available(), sprigcore.dll_path(); print('native engine OK', sprigcore.adapters())"
          if ($LASTEXITCODE -ne 0) { throw "The installed copy can't load the native engine" }
          # After pruning (prune.py): every Qt module SprigCast imports loads, and a web page still opens
          # in Qt WebEngine (its helper, resources and US English text are all there).
          & $py -c "from PySide6 import QtCore, QtGui, QtWidgets, QtNetwork, QtSvg, QtWebChannel, QtWebSockets, QtWebEngineCore, QtWebEngineWidgets; print('Qt modules OK')"
          if ($LASTEXITCODE -ne 0) { throw "A Qt module SprigCast uses is missing after pruning" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $py -c "import sys; from PySide6 import QtCore, QtWidgets, QtWebEngineCore; app = QtWidgets.QApplication(sys.argv); page = QtWebEngineCore.QWebEnginePage(); ok = []; page.loadFinished.connect(lambda r: (ok.append(r), app.quit())); QtCore.QTimer.singleShot(60000, app.quit); page.setHtml('<p>SprigCast</p>'); app.exec(); print('web page loads:', ok); sys.exit(0 if ok == [True] else 1)"
          if ($LASTEXITCODE -ne 0) { throw "Qt WebEngine can't open a page after pruning" }
          # Web page sources play MP4 (H.264/AAC) clips with the page engine laid over PySide6's
          # (packaging/webengine_codecs.py), once one is pinned.
          if (Test-Path packaging\webengine_codecs.json) {
            & $py packaging\webengine_probe.py --expect-h264
            if ($LASTEXITCODE -ne 0) { throw "Web pages can't play H.264/AAC in the installed copy" }
          }
          Remove-Item Env:QT_QPA_PLATFORM
          # Browser sources run in a helper started from SprigCast.exe (#451): it must start, open a page and
          # stay up (no restarts). Chromium doesn't paint offscreen on Windows, so frames aren't checked here.
          $exe = (Resolve-Path "packaging\build\python\SprigCast.exe").Path
          $page = Join-Path $env:RUNNER_TEMP "page.html"
          Set-Content $page "<body style='background:#4fd88f'>SprigCast</body>"
          & $py -c "import logging, sys, time; logging.basicConfig(level=logging.INFO, stream=sys.stdout); sys.executable = r'$exe'; from sprigcast.app import browser_helper as b; h = b.RemoteHost(); h.open('t', {'file': r'$page', 'width': 64, 'height': 36, 'fps': 10}); time.sleep(15); alive = h.proc is not None and h.proc.poll() is None; print('browser helper OK' if alive and h.starts == 1 else f'browser helper FAILED (starts {h.starts})'); h.shutdown(); sys.exit(0 if alive and h.starts == 1 else 1)"
          if ($LASTEXITCODE -ne 0) { throw "The browser helper didn't stay up when started from SprigCast.exe" }
          $size = (Get-ChildItem packaging\build\python -Recurse -File | Measure-Object Length -Sum).Sum
          "Installed size: $([math]::Round($size / 1MB)) MB"
          # SprigCast.exe runs the same Python (a single-dash first argument passes straight to Python).
          $probe = Join-Path $env:RUNNER_TEMP "launcher.txt"
          $p = Start-Process "packaging\build\python\SprigCast.exe" -ArgumentList "-c", "`"import sys, sprigcast; open(r'$probe', 'w').write(f'{sys.executable} {sys.getwindowsversion().build}')`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $probe)) { throw "SprigCast.exe didn't run Python (exit $($p.ExitCode))" }
          "SprigCast.exe runs as: $(Get-Content $probe)"
          # Its manifest must say Windows 10/11, or Windows reports build 9200 and Windows 10 features switch off.
          $build = [int]((Get-Content $probe) -split ' ')[-1]
          if ($build -lt 10000) { throw "SprigCast.exe sees Windows build ${build}: its manifest is missing" }
          # The bundled font (#428) is in the installed copy.
          & $py -c "import sprigcast, pathlib; f = pathlib.Path(sprigcast.__file__).parent / 'data' / 'fonts' / 'Nunito.ttf'; assert f.is_file(), f; print('font OK')"
          if ($LASTEXITCODE -ne 0) { throw "Nunito.ttf is missing from the installed copy" }
          # The licenses ship with it (notices.py): SprigCast's own and every bundled part's.
          foreach ($f in "LICENSE.txt", "THIRD-PARTY-NOTICES.txt") {
            $p = Join-Path "packaging\build\python" $f
            if (-not (Test-Path $p) -or (Get-Item $p).Length -lt 1000) { throw "$f is missing from the installed copy" }
          }
          & $py -c "import sprigcast; print('version shown:', sprigcast.build_label())"
      - name: Start SprigCast for 30 seconds with a video playing
        shell: pwsh
        timeout-minutes: 16  # four runs; smoke.py fails itself after 180 s each with the log tail; this only backs it up
        run: |
          # The whole app, started the way a person starts it (packaging/smoke.py): it must stay open, draw,
          # play a video and log no errors. Catches what only breaks when everything starts at once.
          # This runner has no graphics driver (OpenGL 1.1 only), so for this check only, Qt's software
          # OpenGL (Mesa) sits beside SprigCast.exe as opengl32.dll. It's removed straight after: the
          # installer was built before this step and never has it.
          $home_ = "packaging\build\python"
          $env:SPRIGCAST_DUMP_MEMORY = "1"  # a crash dump here also holds what the crash pointed at
          $gl = Join-Path $home_ "opengl32.dll"
          Copy-Item (Join-Path $home_ "Lib\site-packages\PySide6\opengl32sw.dll") $gl
          try {
            & "$home_\python.exe" packaging\smoke.py 30 (Resolve-Path "$home_\SprigCast.exe").Path
            $code = $LASTEXITCODE
            if ($code -eq 0) {
              # Again with the new engine, which this runner (no graphics driver) wouldn't pick by itself, on
              # small canvases: catches an engine change that makes the frame wait or hang.
              # Three times: an access violation showed in one run of two (2026-11-19, run 44635754229), and one
              # run says little about a fault that comes and goes.
              $env:SPRIGCAST_ENGINE = "native"; $env:SMOKE_LIGHT = "1"
              foreach ($round in 1..3) {
                & "$home_\python.exe" packaging\smoke.py 30 (Resolve-Path "$home_\SprigCast.exe").Path
                $code = $LASTEXITCODE
                if ($code -ne 0) { break }
              }
              Remove-Item Env:SPRIGCAST_ENGINE, Env:SMOKE_LIGHT
            }
          } finally {
            Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith((Resolve-Path $home_).Path) } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Remove-Item $gl -Force
          }
          if ($code -ne 0) { throw "SprigCast didn't start cleanly (see the log above)" }
      - name: Where a start that crashed was
        if: failure()
        shell: pwsh
        run: |
          # No symbols needed: module, nearest exported name, registers and what they point at.
          $logs = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "SprigCast\Logs"
          Get-ChildItem $logs -Filter "crash *.dmp" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=====" $_.Name
            uv run --no-project --with minidump --with pefile python -u packaging/read_dump.py $_.FullName packaging\build\python 2>&1 |
              ForEach-Object { "$_" } | Where-Object { $_ -notmatch "minidump|PEB|Traceback|\^\^\^|buff_reader|_select_segment|Installed|^\s*$" }
          }
          exit 0
      - name: Keep the logs and crash dumps of a start that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: start-up-logs
          path: ~/Documents/SprigCast/Logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Fingerprints and a Microsoft Defender scan
        shell: pwsh
        run: |
          Get-FileHash packaging\out\*.exe, packaging\build\python\Lib\site-packages\sprigcast\camera\*.dll, packaging\build\python\Lib\site-packages\sprigcast\engine\*.dll -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } | Tee-Object packaging\out\SHA256.txt
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Warning "Microsoft Defender isn't on this runner: no scan"; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          $failed = $false
          foreach ($target in (Resolve-Path packaging\out).Path, (Resolve-Path packaging\build\python).Path) {
            & $mp -Scan -ScanType 3 -File $target -DisableRemediation | Out-Host
            if ($LASTEXITCODE -eq 2) { $failed = $true; Write-Error "Defender flagged something in $target" -ErrorAction Continue }
          }
          if ($failed) { Get-MpThreatDetection | Format-List | Out-Host; exit 1 }
          "Defender found nothing" | Tee-Object -Append packaging\out\SHA256.txt
          exit 0
      - name: Screenshots of the wizard pages
        shell: pwsh
        continue-on-error: true
        run: |
          # Open Setup (not silent) and snap each page: Welcome, Install location, Extras and Finish.
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shots = New-Item -ItemType Directory -Force packaging\out\screens
          $setup = Get-ChildItem packaging\out\*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/LANG=en" -PassThru
          $shell = New-Object -ComObject WScript.Shell
          function Snap($name) {
            Start-Sleep -Seconds 3
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $shots "$name.png"))
          }
          Start-Sleep -Seconds 5
          $null = $shell.AppActivate("SprigCast Setup")
          Snap "1-welcome"
          $shell.SendKeys("{ENTER}"); Snap "2-location"
          $shell.SendKeys("{ENTER}"); Snap "3-extras"
          # Install (this runner is thrown away afterwards) and snap the Finish page.
          $null = $shell.AppActivate("SprigCast Setup"); $shell.SendKeys("{ENTER}")
          Start-Sleep -Seconds 90
          $null = $shell.AppActivate("SprigCast Setup"); Snap "4-finish"
          Get-Process | Where-Object { $_.ProcessName -like "SprigCast-Setup*" -or $_.ProcessName -like "*.tmp" } | Stop-Process -Force -ErrorAction SilentlyContinue
          # Also print them into the log (base64, in short lines), for reviewers that can read logs but not artifacts.
          foreach ($f in Get-ChildItem $shots -Filter *.png) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName))
            "SHOT-BEGIN $($f.Name)"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { "SHOT " + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i)) }
            "SHOT-END $($f.Name)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SprigCast-Setup
          path: |
            packaging/out/*.exe
            packaging/out/SHA256.txt
            packaging/out/screens/*.png
          retention-days: 14
      # A v* tag also publishes a GitHub Release with the installer, SHA256.txt and that version's CHANGELOG
      # section. SprigCast's "Check for updates" reads the newest one; it checks the installer against
      # SHA256.txt before running it. Runs only after the Defender scan passed.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $setup = "packaging\out\SprigCast-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Tag $tag doesn't match the version that was built (see pyproject.toml)" }
          & packaging\build\python\python.exe packaging\release_notes.py $version notes.md
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md needs a section for $version" }
          $shown = (& packaging\build\python\python.exe -c "import sprigcast; print(sprigcast.display_version())").Trim()
          gh release create $tag $setup packaging\out\SHA256.txt --title "SprigCast $shown" --notes-file notes.md --verify-tag --latest
      # The release's card in the Discord's public #releases: version, what's new, download, size. Without the
      # DISCORD_RELEASES_WEBHOOK secret nothing is posted; a Discord failure never fails the release.
      - name: Post the release to Discord
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: |
          $setup = "packaging\out\SprigCast-Setup-$("${{ github.ref_name }}".TrimStart("v")).exe"
          & packaging\build\python\python.exe packaging\discord_post.py release "${{ github.ref_name }}" $setup
      # A test-* tag (for example test-2026-11-21) publishes a pre-release for testers: a download link that
      # lasts, with docs/tester-guide.md as its text. The in-app updater skips pre-releases, so nobody is offered
      # a test build as an update. The build names itself a test build (sprigcast.build_label).
      # Run by hand with tester_tag set, the same pre-release is published and the run makes the tag itself at the
      # commit it built, so nobody has to push a tag (a tag made with the run's own token starts no second build).
      - name: Publish the test pre-release
        id: tester
        if: startsWith(github.ref, 'refs/tags/test-') || (github.event_name == 'workflow_dispatch' && inputs.tester_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TESTER_TAG: ${{ inputs.tester_tag }}
        run: |
          $tag = "${{ github.ref_name }}"
          $target = @("--verify-tag")
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = $env:TESTER_TAG.Trim()
            if ($tag -notmatch '^test-[A-Za-z0-9._-]+$') { throw "tester_tag must look like test-0.5-1, not '$tag'" }
            $target = @("--target", "${{ github.sha }}")
          }
          $label = (& packaging\build\python\python.exe -c "import sprigcast; print(sprigcast.build_label())").Trim()
          $setup = Get-ChildItem packaging\out\SprigCast-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "No installer was built" }
          gh release create $tag $setup.FullName packaging\out\SHA256.txt --title "SprigCast $label" --notes-file docs\tester-guide.md @target --prerelease
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "label=$label" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "setup=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      # The test build's card in the Tester Garden's #tester-news (never the public #releases): what changed since
      # the last test build, download, size. Without the DISCORD_TESTER_WEBHOOK secret nothing is posted.
      - name: Post the test build to the Tester Garden
        if: steps.tester.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          DISCORD_TESTER_WEBHOOK: ${{ secrets.DISCORD_TESTER_WEBHOOK }}
        run: |
          & packaging\build\python\python.exe packaging\discord_post.py test "${{ steps.tester.outputs.tag }}" "${{ steps.tester.outputs.setup }}" --label "${{ steps.tester.outputs.label }}"
