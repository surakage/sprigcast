name: Installer screenshot (temporary)
on:
  push:
    branches: [claude/project-thread-8dk4s2]
jobs:
  shot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - shell: pwsh
        run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
      - shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Screenshot the Extras page
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $exe = (Get-ChildItem packaging\out\*.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -PassThru
          $shell = New-Object -ComObject WScript.Shell
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
          }
          for ($i = 1; $i -le 3; $i++) {
            Start-Sleep 6
            $null = $shell.AppActivate("Setup - SprigCast")
            Shot "page$i"
            Start-Sleep 1
            $shell.SendKeys("{ENTER}")
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          foreach ($f in Get-ChildItem shots\*.png) {
            "SHOT-BEGIN $($f.Name)"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($f.FullName)) -split '(.{1000})' | Where-Object { $_ }
            "SHOT-END"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/*.png
