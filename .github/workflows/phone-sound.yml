name: Phone sound helper

# Android Screen's phone sound helper (android/sound): compiled against Android's own android.jar and turned into
# the small jar SprigCast copies to a phone, the same way packaging/build_windows.ps1 builds it for the installer.
on:
  workflow_dispatch:
  pull_request:
    paths: ["android/**", ".github/workflows/phone-sound.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          platform=$(ls -d "$sdk"/platforms/android-* | grep -E 'android-[0-9]+$' | sort -t- -k2 -n | tail -1)
          tools=$(ls -d "$sdk"/build-tools/* | grep -E '/[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Using $platform and $tools"
          mkdir -p build/classes
          javac -source 8 -target 8 -nowarn -encoding UTF-8 -classpath "$platform/android.jar" -d build/classes \
            $(find android/sound/src -name '*.java')
          "$tools/d8" --release --min-api 30 --output build/sprigcast-sound.jar $(find build/classes -name '*.class')
          ls -l build/sprigcast-sound.jar
          unzip -l build/sprigcast-sound.jar | grep classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: sprigcast-sound
          path: build/sprigcast-sound.jar
