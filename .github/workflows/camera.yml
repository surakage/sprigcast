name: Camera DLL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["native/camera/**", ".github/workflows/camera.yml", "src/sprigcast/output/virtualcam.py"]
  pull_request:
    paths: ["native/camera/**", ".github/workflows/camera.yml", "src/sprigcast/output/virtualcam.py"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: |
          cmake -S native/camera -B build/camera -A x64
          cmake --build build/camera --config Release
          cmake -S native/camera -B build/camera32 -A Win32
          cmake --build build/camera32 --config Release
      - name: Check the exports
        shell: pwsh
        run: |
          $dll = "build/camera/Release/sprigcast_camera.dll"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          $out = & $dumpbin.FullName /exports $dll | Out-String
          foreach ($name in "DllGetClassObject", "DllRegisterServer", "SC_Start", "SC_Stop", "SC_Stage", "SC_SelfTest", "SC_Version") {
            if ($out -notmatch $name) { throw "missing export $name" }
          }
          $deps = & $dumpbin.FullName /dependents $dll | Out-String
          if ($deps -match "VCRUNTIME|MSVCP") { throw "the DLL must not need the VC++ runtime: $deps" }
          Write-Output $deps
      - name: Register it and capture frames like an app would (DirectShow)
        shell: pwsh
        run: |
          $dll = (Resolve-Path "build/camera/Release/sprigcast_camera.dll").Path
          $dll32 = (Resolve-Path "build/camera32/Release/sprigcast_camera32.dll").Path
          $p = Start-Process regsvr32 -ArgumentList "/s", "`"$dll`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "regsvr32 (64-bit) failed: $($p.ExitCode)" }
          $p = Start-Process regsvr32 -ArgumentList "/s", "`"$dll32`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "regsvr32 (32-bit) failed: $($p.ExitCode)" }
          choco install ffmpeg -y --no-progress | Out-Null
          $env:Path = "C:\ProgramData\chocolatey\bin;" + $env:Path
          $list = ffmpeg -hide_banner -f dshow -list_devices true -i dummy 2>&1 | Out-String
          Write-Output $list
          if ($list -notmatch "SprigCast Camera") { throw "SprigCast Camera isn't listed" }
          $opts = ffmpeg -hide_banner -f dshow -list_options true -i "video=SprigCast Camera" 2>&1 | Out-String
          Write-Output $opts
          # SprigCast's side feeds frames through the shared block while ffmpeg records 3 s from the camera.
          $env:PYTHONPATH = "src"
          $feeder = Start-Process python -ArgumentList "native/camera/tools/feed_test.py", "8" -NoNewWindow -PassThru
          ffmpeg -hide_banner -y -f dshow -video_size 1280x720 -i "video=SprigCast Camera" -t 3 -update 1 camera-test.png 2>&1 | Out-String | Write-Output
          ffmpeg -hide_banner -y -f dshow -video_size 1080x1920 -pixel_format yuyv422 -i "video=SprigCast Camera" -t 2 -update 1 camera-test-yuy2.png 2>&1 | Out-String | Write-Output
          ffmpeg -hide_banner -y -f dshow -video_size 720x1280 -pixel_format yuv420p -i "video=SprigCast Camera" -t 2 -vf "crop=2:2:360:640" -f rawvideo -pix_fmt gray camera-test-i420.raw 2>&1 | Out-String | Write-Output
          $feeder.WaitForExit()
          if ($feeder.ExitCode -ne 0) { throw "SprigCast's side never saw the camera ask for frames" }
          foreach ($f in "camera-test.png", "camera-test-yuy2.png", "camera-test-i420.raw") {
            if (-not (Test-Path $f)) { throw "no frame came out of the camera ($f)" }
          }
          $luma = [System.IO.File]::ReadAllBytes("camera-test-i420.raw")
          $last = $luma[-1]
          # ffmpeg's gray is full range: SprigCast's Y=180 reads 191, the camera's placeholder Y=38 reads 26.
          Write-Output "last centre luma: $last (expect 191 for SprigCast's frame, 26 for the placeholder)"
          if ([math]::Abs($last - 191) -gt 6) { throw "the camera didn't show SprigCast's frames" }
          Get-Content "$env:ProgramData\SprigCast Camera\camera.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: sprigcast-camera
          path: |
            build/camera/Release/sprigcast_camera.dll
            build/camera32/Release/sprigcast_camera32.dll
            camera-test*.png
          retention-days: 14
