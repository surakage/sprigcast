name: Native engine

# sprigcore.dll (native/core): build it, run its own checks on Windows' software renderer, run the Python side's
# pixel checks against it, and do it all again under AddressSanitizer, which stops on the first memory mistake.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["native/core/**", ".github/workflows/core.yml", "src/sprigcast/sprigcore.py", "src/sprigcast/render/**",
            "src/sprigcast/core/filters.py", "src/sprigcast/core/scene.py", "tests/test_sprigcore.py",
            "tests/test_native_compositor.py", "tests/test_native_bridge.py", "tests/native_cases.py", "tests/native_golden/**",
            "native/third_party/**", "src/sprigcast/sources/media.py", "tests/test_native_media.py",
            "src/sprigcast/app/browser_helper.py", "tests/test_native_shared.py", "tests/test_native_writer.py",
            "src/sprigcast/app/browser_quick.py", "tests/test_native_page_texture.py",
            "src/sprigcast/audio/native_mixer.py", "src/sprigcast/sources/audio.py", "tests/test_native_mixer.py",
            "tests/test_native_capture.py", "tests/test_native_playback.py", "tests/test_native_filters.py",
            "src/sprigcast/store/audio_visualizer.py", "tests/test_native_visualizer.py",
            "src/sprigcast/core/drawn.py", "src/sprigcast/store/snap.py", "src/sprigcast/store/death_count.py",
            "tests/test_native_drawn.py", "src/sprigcast/store/now_playing.py", "tests/test_native_now_playing.py",
            "src/sprigcast/store/pngtuber.py", "tests/test_native_pngtuber.py",
            "src/sprigcast/sources/capture.py", "tests/test_native_screen_capture.py",
            "src/sprigcast/sources/camera.py", "tests/test_native_camera.py",
            "src/sprigcast/render/move.py", "tests/test_native_move.py"]
  pull_request:
    paths: ["native/core/**", ".github/workflows/core.yml", "src/sprigcast/sprigcore.py", "src/sprigcast/render/**",
            "src/sprigcast/core/filters.py", "src/sprigcast/core/scene.py", "tests/test_sprigcore.py",
            "tests/test_native_compositor.py", "tests/test_native_bridge.py", "tests/native_cases.py", "tests/native_golden/**",
            "native/third_party/**", "src/sprigcast/sources/media.py", "tests/test_native_media.py",
            "src/sprigcast/app/browser_helper.py", "tests/test_native_shared.py", "tests/test_native_writer.py",
            "src/sprigcast/app/browser_quick.py", "tests/test_native_page_texture.py",
            "src/sprigcast/audio/native_mixer.py", "src/sprigcast/sources/audio.py", "tests/test_native_mixer.py",
            "tests/test_native_capture.py", "tests/test_native_playback.py", "tests/test_native_filters.py",
            "src/sprigcast/store/audio_visualizer.py", "tests/test_native_visualizer.py",
            "src/sprigcast/core/drawn.py", "src/sprigcast/store/snap.py", "src/sprigcast/store/death_count.py",
            "tests/test_native_drawn.py", "src/sprigcast/store/now_playing.py", "tests/test_native_now_playing.py",
            "src/sprigcast/store/pngtuber.py", "tests/test_native_pngtuber.py",
            "src/sprigcast/sources/capture.py", "tests/test_native_screen_capture.py",
            "src/sprigcast/sources/camera.py", "tests/test_native_camera.py",
            "src/sprigcast/render/move.py", "tests/test_native_move.py"]

jobs:
  read-dump:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: start-up-logs
          run-id: 44646097603
          github-token: ${{ github.token }}
          path: dump
      - name: Read the dump
        shell: pwsh
        run: |
          $dmp = (Get-ChildItem dump -Recurse -Filter *.dmp | Select-Object -First 1).FullName
          uv venv qt --python 3.12
          uv pip install --python qt "pyside6-essentials==6.12.0" "shiboken6==6.12.0" | Out-Null
          $py = (Get-Command python).Source
          uv run --no-project --with minidump --with pefile python packaging/read_dump.py "$dmp" qt 2>&1 | Select-String -NotMatch "minidump\\|PEB|Traceback|\^\^|raise Exception|not in process memory|buff_reader|self\.|Installed" | Select-Object -First 400
