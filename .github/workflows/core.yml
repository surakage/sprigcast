name: Native engine

# sprigcore.dll (native/core): build it, run its own checks on Windows' software renderer, run the Python side's
# pixel checks against it, and do it all again under AddressSanitizer, which stops on the first memory mistake.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["native/core/**", ".github/workflows/core.yml", "src/sprigcast/sprigcore.py", "src/sprigcast/render/**",
            "src/sprigcast/core/filters.py", "src/sprigcast/core/scene.py", "tests/test_sprigcore.py",
            "tests/test_native_compositor.py", "tests/test_native_bridge.py", "tests/native_cases.py", "tests/native_golden/**",
            "native/third_party/**", "src/sprigcast/sources/media.py", "tests/test_native_media.py",
            "src/sprigcast/app/browser_helper.py", "tests/test_native_shared.py"]
  pull_request:
    paths: ["native/core/**", ".github/workflows/core.yml", "src/sprigcast/sprigcore.py", "src/sprigcast/render/**",
            "src/sprigcast/core/filters.py", "src/sprigcast/core/scene.py", "tests/test_sprigcore.py",
            "tests/test_native_compositor.py", "tests/test_native_bridge.py", "tests/native_cases.py", "tests/native_golden/**",
            "native/third_party/**", "src/sprigcast/sources/media.py", "tests/test_native_media.py",
            "src/sprigcast/app/browser_helper.py", "tests/test_native_shared.py"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        shell: pwsh
        run: |
          cmake -S native/core -B build/core -A x64
          cmake --build build/core --config Release
      - name: Engine checks
        shell: pwsh
        run: ctest --test-dir build/core -C Release --output-on-failure
      - name: No runtime to install, and every function exported
        shell: pwsh
        run: |
          $dll = "build/core/Release/sprigcore.dll"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents $dll | Out-String
          Write-Output $deps
          if ($deps -match "VCRUNTIME|MSVCP") { throw "sprigcore.dll must not need the VC++ runtime" }
          $exports = & $dumpbin.FullName /exports $dll | Out-String
          $names = Select-String -Path native/core/include/sprigcore.h -Pattern "SC_API [^(]*?\b(sc_\w+)\(" -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value }
          foreach ($name in $names) { if ($exports -notmatch "\b$name\b") { throw "missing export $name" } }
          "exports OK: $($names.Count)"
      - name: Python side and pixel checks
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:SPRIGCAST_CORE_DLL = (Resolve-Path "build/core/Release/sprigcore.dll").Path
          $env:PYTHONPATH = "src"
          uv run --frozen python -c "from sprigcast import sprigcore; assert sprigcore.available(), 'not loaded'; print(sprigcore.adapters())"
          uv run --frozen pytest -q tests/test_sprigcore.py tests/test_native_compositor.py tests/test_native_bridge.py tests/test_native_shared.py -rs 2>&1 | Tee-Object -FilePath pytest.txt
          if ($LASTEXITCODE -ne 0) { throw "pixel checks failed" }
          if (Select-String -Path pytest.txt -Pattern "isn't built here" -Quiet) { throw "engine checks were skipped though the DLL is built" }
      - name: Video, GIF and sound files played by the engine
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:SPRIGCAST_CORE_DLL = (Resolve-Path "build/core/Release/sprigcore.dll").Path
          $env:PYTHONPATH = "src"
          uv run --frozen python -c "from sprigcast import sprigcore; print(sprigcore.ffmpeg_libraries()); assert sprigcore.media_ready(), 'the engine could not load FFmpeg'"
          uv run --frozen pytest -q tests/test_native_media.py -rs 2>&1 | Tee-Object -FilePath media.txt
          if ($LASTEXITCODE -ne 0) { throw "media checks failed" }
          if (Select-String -Path media.txt -Pattern "isn't built|no g\+\+" -Quiet) { throw "media checks were skipped though the DLL is built" }
      - name: Engine checks under AddressSanitizer
        shell: pwsh
        run: |
          cmake -S native/core -B build/core-asan -A x64 -DSPRIGCORE_ASAN=ON
          cmake --build build/core-asan --config Release
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $asan = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter clang_rt.asan_dynamic-x86_64.dll | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          Copy-Item $asan.FullName build/core-asan/Release/
          ctest --test-dir build/core-asan -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: sprigcore
          path: |
            build/core/Release/sprigcore.dll
            build/core/Release/sprigcore.pdb
          retention-days: 30
