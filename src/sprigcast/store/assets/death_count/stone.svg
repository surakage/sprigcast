<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <!-- Death count's gravestone: warm mossy stone, a leafy sprig on top, a gold leaf badge.
       The label and the number are engraved by the plugin, in the plaque (84..316, 150..402). -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b665b"/><stop offset="1" stop-color="#57534a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#bdb7a5"/><stop offset="1" stop-color="#8f897a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc152"/><stop offset="1" stop-color="#6fa53d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2b25c"/><stop offset="1" stop-color="#b07c30"/>
    </linearGradient>
  </defs>
  <!-- the stone: a darker rim, then the face -->
  <path d="M40 520 V200 Q40 46 200 46 Q360 46 360 200 V520 Z" fill="url(#edge)"/>
  <path d="M58 520 V204 Q58 64 200 64 Q342 64 342 204 V520 Z" fill="url(#face)"/>
  <path d="M74 200 Q76 84 200 80" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
  <!-- plaque: a sunken panel for the words -->
  <rect x="84" y="150" width="232" height="252" rx="22" fill="#000000" opacity="0.10"/>
  <rect x="84" y="150" width="232" height="252" rx="22" fill="none" stroke="#6f6a5d" stroke-opacity="0.55" stroke-width="3"/>
  <path d="M106 152 H294" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <!-- cracks and speckles -->
  <g fill="none" stroke="#5e594e" stroke-opacity="0.6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 270 L316 288 L322 302 L308 322"/>
    <path d="M70 440 L84 452 L80 470"/>
  </g>
  <g fill="#6f6a5d" opacity="0.35">
    <circle cx="300" cy="120" r="3"/><circle cx="110" cy="118" r="2.5"/><circle cx="326" cy="470" r="3"/>
    <circle cx="96" cy="480" r="2"/><circle cx="250" cy="452" r="2.5"/><circle cx="140" cy="448" r="2"/>
  </g>
  <!-- moss along the top -->
  <path d="M52 176 Q60 120 104 90 Q132 74 162 70 Q150 86 128 92 Q100 104 86 132 Q74 154 72 182 Q62 186 52 176 Z" fill="#6fa53d" opacity="0.9"/>
  <path d="M64 168 Q70 132 98 108 Q90 132 84 166 Z" fill="#8cc152" opacity="0.9"/>
  <path d="M300 84 Q330 98 344 132 Q336 126 326 124 Q318 104 300 96 Z" fill="#6fa53d" opacity="0.85"/>
  <!-- a sprig growing from the top -->
  <path d="M206 64 Q204 40 214 18" fill="none" stroke="#4f8a2c" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="190" cy="30" rx="26" ry="11" transform="rotate(30 190 30)" fill="url(#leaf)"/>
  <ellipse cx="236" cy="22" rx="28" ry="12" transform="rotate(-28 236 22)" fill="#3ecf7f"/>
  <ellipse cx="236" cy="22" rx="28" ry="12" transform="rotate(-28 236 22)" fill="#2a9c5e" opacity="0.35"/>
  <path d="M176 22 L204 36 M216 30 L254 14" stroke="#4f8a2c" stroke-width="2" stroke-linecap="round"/>
  <!-- gold leaf badge under the plaque -->
  <circle cx="200" cy="436" r="20" fill="url(#gold)"/>
  <circle cx="200" cy="436" r="15" fill="none" stroke="#7a5320" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M190 445 C190 432 198 426 211 426 C211 439 203 445 190 445 Z" fill="#fff3d6"/>
  <path d="M191 444 L203 433" stroke="#b07c30" stroke-width="1.8"/>
</svg>
