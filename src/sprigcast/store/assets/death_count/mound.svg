  <ellipse cx="118" cy="38" rx="12" ry="5.5" transform="rotate(30 118 38)" fill="#3ecf7f"/>
  <ellipse cx="138" cy="32" rx="12" ry="5.5" transform="rotate(-25 138 32)" fill="#8cc152"/>
  <path d="M478 64 Q480 44 470 32" fill="none" stroke="#4f8a2c" stroke-width="3" stroke-linecap="round"/>
