  <ellipse cx="300" cy="162" rx="290" ry="12" fill="#000000" opacity="0.22"/>
  <path d="M14 166 Q40 70 150 48 Q220 36 300 38 Q380 36 450 48 Q560 70 586 166 Z" fill="url(#dirt)"/>
