      <stop offset="0" stop-color="#7a4b2a"/><stop offset="1" stop-color="#4f2f1a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc152"/><stop offset="1" stop-color="#5f9433"/>
