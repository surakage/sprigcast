    <ellipse cx="300" cy="130" rx="11" ry="5"/><ellipse cx="96" cy="140" rx="6" ry="3.5"/><ellipse cx="500" cy="138" rx="8" ry="4"/>
  </g>
  <g fill="#a57a52" opacity="0.7">
    <circle cx="230" cy="90" r="5"/><circle cx="380" cy="120" r="4"/><circle cx="120" cy="120" r="3.5"/><circle cx="470" cy="110" r="4.5"/>
  </g>
