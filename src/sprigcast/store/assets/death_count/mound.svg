    <path d="M232 50 L238 26 L246 48 Z"/>
    <path d="M356 50 L362 24 L370 48 L378 30 L382 50 Z"/>
    <path d="M430 56 L436 30 L444 54 L452 34 L458 58 Z"/>
    <path d="M492 70 L498 46 L506 68 L514 50 L518 76 Z"/>
