<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Snap's camera: a leafy green top, a wooden body, a gold lens. -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc152"/><stop offset="1" stop-color="#6fa53d"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6238"/><stop offset="1" stop-color="#744526"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2b25c"/><stop offset="1" stop-color="#b07c30"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#2f5a50"/><stop offset="0.6" stop-color="#16302b"/><stop offset="1" stop-color="#0a1614"/>
    </radialGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b07c30"/><stop offset="1" stop-color="#e2b25c"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="214" rx="104" ry="7" fill="#000000" opacity="0.25"/>
  <!-- side knobs -->
  <rect x="11" y="84" width="11" height="18" rx="3" fill="url(#knob)"/>
  <rect x="234" y="84" width="11" height="18" rx="3" fill="url(#knob)"/>
  <!-- green top -->
  <path d="M20 122 V76 Q20 56 40 56 H216 Q236 56 236 76 V122 Z" fill="url(#leaf)"/>
  <path d="M30 62 H226" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
  <!-- wooden body -->
  <path d="M20 122 H236 V196 Q236 212 220 212 H36 Q20 212 20 196 Z" fill="url(#wood)"/>
  <g fill="none" stroke="#5e3820" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
  <path d="M30 140 C70 134 100 146 140 140 S210 134 226 142" />
  <path d="M26 160 C60 154 96 166 132 160 S200 152 230 162" />
  <path d="M34 178 C66 174 98 184 150 178 S206 172 222 180" />
  </g>
  <rect x="20" y="120" width="216" height="4" fill="#5e3820" opacity="0.35"/>
  <!-- viewfinder -->
  <rect x="35" y="68" width="30" height="21" rx="5" fill="#3b2a1d"/>
  <rect x="39" y="72" width="22" height="13" rx="3" fill="#2d5249"/>
  <rect x="41" y="73.5" width="9" height="3" rx="1.5" fill="#ffffff" opacity="0.35"/>
  <!-- orange button -->
  <circle cx="48" cy="108" r="9" fill="#e8742c"/>
  <circle cx="48" cy="108" r="7" fill="#f39a4c"/>
  <circle cx="45.5" cy="105" r="2.3" fill="#ffe0bf" opacity="0.8"/>
  <!-- flash -->
  <rect x="195" y="65" width="36" height="26" rx="5" fill="#8a5a2c"/>
  <rect x="198" y="68" width="30" height="20" rx="3" fill="#f8e9bd"/>
  <g stroke="#d8bf86" stroke-width="1.4">
    <line x1="205.5" y1="68" x2="205.5" y2="88"/><line x1="213" y1="68" x2="213" y2="88"/><line x1="220.5" y1="68" x2="220.5" y2="88"/>
    <line x1="198" y1="74.7" x2="228" y2="74.7"/><line x1="198" y1="81.3" x2="228" y2="81.3"/>
  </g>
  <!-- leaf badge -->
  <circle cx="213" cy="112" r="10" fill="none" stroke="#f3e2b4" stroke-width="2"/>
  <path d="M207 117 C207 110 212 106 219 106 C219 113 214 117 207 117 Z" fill="#f3e2b4"/>
  <path d="M207.5 116.5 L215 109.5" stroke="#6fa53d" stroke-width="1.3"/>
  <!-- lens -->
  <circle cx="130" cy="104" r="46" fill="#3b2a1d"/>
  <circle cx="130" cy="104" r="43" fill="url(#gold)"/>
  <g stroke="#7a5320" stroke-width="1.6" stroke-linecap="round"><line x1="168.5" y1="104.0" x2="172.0" y2="104.0"/><line x1="165.6" y1="118.7" x2="168.8" y2="120.1"/><line x1="157.2" y1="131.2" x2="159.7" y2="133.7"/><line x1="144.7" y1="139.6" x2="146.1" y2="142.8"/><line x1="130.0" y1="142.5" x2="130.0" y2="146.0"/><line x1="115.3" y1="139.6" x2="113.9" y2="142.8"/><line x1="102.8" y1="131.2" x2="100.3" y2="133.7"/><line x1="94.4" y1="118.7" x2="91.2" y2="120.1"/><line x1="91.5" y1="104.0" x2="88.0" y2="104.0"/><line x1="94.4" y1="89.3" x2="91.2" y2="87.9"/><line x1="102.8" y1="76.8" x2="100.3" y2="74.3"/><line x1="115.3" y1="68.4" x2="113.9" y2="65.2"/><line x1="130.0" y1="65.5" x2="130.0" y2="62.0"/><line x1="144.7" y1="68.4" x2="146.1" y2="65.2"/><line x1="157.2" y1="76.8" x2="159.7" y2="74.3"/><line x1="165.6" y1="89.3" x2="168.8" y2="87.9"/></g>
  <circle cx="130" cy="104" r="35" fill="#2b2118"/>
  <circle cx="130" cy="104" r="29" fill="url(#glass)"/>
  <circle cx="130" cy="104" r="10" fill="#050a09"/>
  <path d="M112 92 A22 22 0 0 1 124 82" fill="none" stroke="#e8f5ef" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="141" cy="116" r="2.8" fill="#e8f5ef" opacity="0.35"/>
  <!-- the slot the photo comes out of -->
  <rect x="50" y="193" width="160" height="10" rx="5" fill="#1d120b"/>
  <rect x="54" y="195" width="152" height="2" rx="1" fill="#000000" opacity="0.4"/>
</svg>
