<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- SprigCast: a sleepy sloth with a sprig in bloom. Slothbloom colours. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b7a4f"/>
      <stop offset="1" stop-color="#0b3a26"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b48a"/>
      <stop offset="1" stop-color="#b38b62"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf0ad"/>
      <stop offset="1" stop-color="#2fbf6f"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#3ddc84" stroke-opacity=".35" stroke-width="4"/>
  <!-- sprig growing from the head -->
  <path d="M128 92 C126 74 132 58 146 44" fill="none" stroke="#2fbf6f" stroke-width="7" stroke-linecap="round"/>
  <path d="M130 72 C110 70 96 58 94 44 C112 44 126 54 130 72 Z" fill="url(#leaf)"/>
  <path d="M136 62 C150 64 164 58 172 48 C158 42 142 48 136 62 Z" fill="url(#leaf)"/>
  <g transform="translate(148 38)">
    <circle r="11" cx="0" cy="-12" fill="#ff5fa2"/>
    <circle r="11" cx="11.4" cy="-3.7" fill="#ff5fa2"/>
    <circle r="11" cx="7" cy="9.7" fill="#ff5fa2"/>
    <circle r="11" cx="-7" cy="9.7" fill="#ff5fa2"/>
    <circle r="11" cx="-11.4" cy="-3.7" fill="#ff5fa2"/>
    <circle r="7" fill="#ffd23f"/>
  </g>
  <!-- head -->
  <ellipse cx="128" cy="156" rx="82" ry="72" fill="url(#fur)"/>
  <ellipse cx="128" cy="164" rx="64" ry="52" fill="#f3e2c8"/>
  <!-- eye patches, sloping down and out -->
  <ellipse cx="96" cy="152" rx="25" ry="15" transform="rotate(-22 96 152)" fill="#4a3222"/>
  <ellipse cx="160" cy="152" rx="25" ry="15" transform="rotate(22 160 152)" fill="#4a3222"/>
  <!-- sleepy closed eyes -->
  <path d="M86 154 Q96 161 106 150" fill="none" stroke="#f3e2c8" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M150 150 Q160 161 170 154" fill="none" stroke="#f3e2c8" stroke-width="4.5" stroke-linecap="round"/>
  <!-- nose and smile -->
  <ellipse cx="128" cy="176" rx="12" ry="8" fill="#3a2618"/>
  <path d="M114 192 Q128 204 142 192" fill="none" stroke="#3a2618" stroke-width="4.5" stroke-linecap="round"/>
  <!-- rosy cheeks -->
  <ellipse cx="88" cy="184" rx="9" ry="5" fill="#ff5fa2" fill-opacity=".35"/>
  <ellipse cx="168" cy="184" rx="9" ry="5" fill="#ff5fa2" fill-opacity=".35"/>
</svg>
