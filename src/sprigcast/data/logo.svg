<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- SprigCast: a leaf (sprig) with a play mark cut out (cast), and a pink live dot (bloom). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14533a"/>
      <stop offset="1" stop-color="#0a2a1d"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbf6f"/>
      <stop offset="1" stop-color="#5ff0a0"/>
    </linearGradient>
    <mask id="cut">
      <rect width="256" height="256" fill="#fff"/>
      <path d="M112 104 L160 132 L112 160 Z" fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <path d="M56 200 C56 112 112 56 200 56 C200 144 144 200 56 200 Z" fill="url(#leaf)" mask="url(#cut)"/>
  <circle cx="194" cy="194" r="16" fill="#ff5fa2"/>
</svg>
